name: InvestTrack CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Analyze, Test, and Distribute
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter environment
        run: flutter --version

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - id: test_check
        name: Detect test suite
        run: |
          if [ -d test ] && [ "$(ls -A test)" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.test_check.outputs.has_tests == 'true'
        run: flutter test

      - name: Set build metadata
        id: metadata
        run: |
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestTrack-Release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Distribute release to Firebase App Distribution
        if: github.event_name != 'pull_request'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: Developers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Commit SHA: ${{ github.sha }}
            Branch: ${{ github.ref_name || github.head_ref }}
            Commit Message: ${{ github.event.head_commit.message || github.event.pull_request.title || 'No commit message' }}
            Build Time: ${{ steps.metadata.outputs.build_time }}
